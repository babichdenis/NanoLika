# NanoLika Cloud without TLS: the relay alone, on a loopback port, codes in the log.
#
# An override for a home server, a LAN or a Tailscale network — and for testing.
# Caddy stays out of the way (it is moved behind the `tls` profile), the relay
# listens on 127.0.0.1:8787, and the settings a local install needs have defaults
# so an .env written for a public server works here as well.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   curl http://127.0.0.1:8787/healthz
#   docker compose -f docker-compose.yml -f docker-compose.local.yml logs -f relay   # the sign-in codes
#
# To reach it from other machines, set RELAY_BIND=0.0.0.0 (or the Tailscale
# address) and PUBLIC_BASE=http://<that address>:8787 in .env — the apps are
# told PUBLIC_BASE as their server. NANOMUSE_ENV_FILE points at an .env kept
# somewhere else than ./.env.

services:
  relay:
    env_file:
      - path: ${NANOMUSE_ENV_FILE:-.env}
        required: false
    ports:
      - "${RELAY_BIND:-127.0.0.1}:${RELAY_PORT:-8787}:8787"
    environment:
      PUBLIC_BASE: ${PUBLIC_BASE:-http://127.0.0.1:8787}
      CODE_SENDER: ${CODE_SENDER:-log}

  caddy:
    profiles: ["tls"]
