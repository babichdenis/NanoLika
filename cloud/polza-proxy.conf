# polza.ai принимает ключ только в X-API-Key, а релей шлёт Authorization: Bearer.
# Этот прокси внутри docker-сети дописывает нужный заголовок.
server {
    listen 80;
    # релей пропускает до 20 МБ (Caddy request_body); у nginx по умолчанию 1 МБ,
    # и длинная переписка Лики упиралась в 413
    client_max_body_size 20m;
    # polza.ai переезжает (05.11.2026: адрес 136.234.72.27 перестал отвечать, DNS
    # уже отдавал 91.184.237.x), а nginx без resolver запоминает IP на старте и
    # держит мёртвый адрес до перезапуска: каждый чат ждал 60 с и получал 504.
    # Resolver Docker плюс короткий valid заставляют переспрашивать DNS.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $polza https://polza.ai;
    location / {
        proxy_pass $polza/api$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host polza.ai;
        proxy_set_header X-API-Key ${POLZA_KEY};
        proxy_set_header Authorization "";
        proxy_http_version 1.1;
        proxy_buffering off;
        # Мёртвый маршрут отваливается за десять секунд, а не за минуту: релей
        # успевает уйти к следующему поставщику, пока человек ещё ждёт ответ.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
