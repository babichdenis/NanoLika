<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Алерты · nanoLika</title>
<link rel="icon" href="/web/assets/icon.svg?v=20261024-butterfly" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f7f1e6; color: #2b261e; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid #e2d8c6; background: #fffdf8; position: sticky; top: 0; z-index: 2; }
  header a { color: inherit; text-decoration: none; font-weight: 600; }
  header strong { font-size: 1rem; }
  main { padding: 24px; max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; }
  h2 { font-size: 1.1rem; margin: 24px 0 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; }
  button { padding: 6px 12px; border-radius: 8px; border: 1px solid #d8ccb8; background: #fff; color: inherit; cursor: pointer; font: inherit; }
  button.on { background: #2b261e; color: #fff; border-color: #2b261e; }
  table { width: 100%; border-collapse: collapse; background: #fffdf8; border: 1px solid #e2d8c6; border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee5d6; font-size: 0.92rem; vertical-align: top; }
  th { background: #f3ead9; font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .muted { color: #7a6f5d; }
  .bad { color: #a33; font-weight: 600; }
  .ok { color: #2a7; }
  input { padding: 8px 10px; border-radius: 8px; border: 1px solid #d8ccb8; min-width: 280px; font: inherit; }
</style>
</head>
<body>
<header>
  <a href="/app/admin/">← Админка</a>
  <strong>Алерты и модели</strong>
  <span id="status" class="muted"></span>
</header>
<main>
  <h1>Что требует внимания</h1>
  <div class="row" id="auth" hidden>
    <input id="token" type="password" placeholder="X-Admin-Token" autocomplete="off">
    <button id="save" type="button">Войти</button>
  </div>
  <div class="row" id="periods" hidden></div>
  <div class="row" id="notify-row" hidden>
    <button id="notify" type="button">Отправить на почту</button>
    <span id="notify-status" class="muted"></span>
  </div>
  <div id="totals" class="muted"></div>
  <div id="content"></div>
</main>
<script src="alerts.js"></script>
</body>
</html>
