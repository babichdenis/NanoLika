upstream marosensor_origin {
    server 141.8.192.217:443 max_fails=1 fail_timeout=60s;
    server 127.0.0.1:8443 backup;
    keepalive 8;
}

server {
    listen 127.0.0.1:8897;
    server_name _;
    root /srv/mirror/current;
    index index.html;
    access_log off;

    location / {
        proxy_pass https://marosensor_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name marosensor.ru;
        proxy_ssl_verify off;
        proxy_connect_timeout 8s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @fallback;
    }

    location @fallback {
        if ($request_method = POST) {
            return 503 "Сайт работает в резервном режиме. Напишите на office@memsnav.ru";
        }
        rewrite ^(.*)/$ $1/index.html break;
        try_files $uri /index.html =404;
        add_header X-Marosensor-Mirror "fallback" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
